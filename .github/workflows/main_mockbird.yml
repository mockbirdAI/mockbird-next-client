# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - mockbird

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://mockbird.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_c9918768a2c24f06a61ed18a4c57bb29 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_6d5600dc8409430aaae299fd1baa0732 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: mockbird.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_c9918768a2c24f06a61ed18a4c57bb29 }}/mockbird:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'mockbird'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_8049f328338e4a3eba36c2318fcc574e }}
        images: 'mockbird.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_c9918768a2c24f06a61ed18a4c57bb29 }}/mockbird:${{ github.sha }}'